# Focused GEN-195 checks; does not run the full backend suite.
name: Connector channel sources

on:
  pull_request:
    paths:
      - "apps/backend/chatballs/conversations/client*.py"
      - "apps/backend/chatballs/integrations/display_platform.py"
      - "apps/backend/chatballs/conversations/serializers.py"
      - "apps/backend/chatballs/conversations/serializer_context.py"
      - "apps/internal-ui/src/shared/providers*"
      - "apps/internal-ui/src/features/sales/**"
      - "apps/internal-ui/src/features/conversations/**"
      - "apps/internal-ui/src/features/integrations/ConnectionsTable.tsx"
      - ".github/workflows/connector-channel-sources.yml"
  push:
    branches: [feat/gen-195-native-channel-identity]

permissions:
  contents: read

jobs:
  backend:
    name: Contact source regression
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: chatballs
          POSTGRES_USER: chatballs_bootstrap
          POSTGRES_PASSWORD: chatballs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatballs_bootstrap -d chatballs"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      POSTGRES_DB: chatballs
      POSTGRES_USER: chatballs_bootstrap
      POSTGRES_PASSWORD: chatballs
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379/0
      CHATBALLS_SECRET_KEY: github-test-only-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: python -m pip install -r apps/backend/requirements.txt
      - name: Contact list, channels, filters and identities
        working-directory: apps/backend
        run: python -m pytest -q chatballs/conversations/test_clients_list.py

  frontend:
    name: Messenger presentation regression
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm --workspace @chatballs/internal-ui run test -- src/shared/providers.test.ts
