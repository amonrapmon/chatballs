name: API Connector independent adapter conformance

on:
  pull_request:
    paths:
      - "contracts/api-connector-v1/**"
      - "apps/backend/chatballs/api_connector/testing_fake_adapter.py"
      - ".github/workflows/api-connector-conformance.yml"
  push:
    branches: ["feat/api-connector-upstream"]
    paths:
      - "contracts/api-connector-v1/**"
      - "apps/backend/chatballs/api_connector/testing_fake_adapter.py"
      - ".github/workflows/api-connector-conformance.yml"

permissions:
  contents: read

jobs:
  adapter-conformance:
    name: Provider-free v1 adapter contract and HTTP reference
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only independent contract tooling
        run: python -m pip install "jsonschema>=4.23,<5" "ruff>=0.12,<0.13"
      - name: Lint independent conformance code
        run: ruff check contracts/api-connector-v1/conformance
      - name: Offline v1 fixture/schema checks
        run: python contracts/api-connector-v1/conformance/adapter_check.py --json
      - name: Loopback HTTP receiver contract tests
        run: python -m unittest discover -s contracts/api-connector-v1/conformance -p "test_*.py" -v
