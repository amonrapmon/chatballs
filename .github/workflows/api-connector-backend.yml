name: API Connector backend integration

on:
  push:
    branches: ["feat/api-connector-upstream"]
    paths:
      - "apps/backend/chatballs/api_connector/**"
      - "apps/backend/chatballs/conversations/operator_messages.py"
      - "apps/backend/chatballs/conversations/message_models.py"
      - "apps/backend/chatballs/conversations/event_handlers.py"
      - "apps/backend/chatballs/conversations/serializers.py"
      - "apps/backend/chatballs/conversations/migrations/0050_connector_operator_delivery.py"
      - "apps/backend/chatballs/conversations/migrations/0052_message_connector_origin.py"
      - "apps/backend/chatballs/conversations/inbound_dedup.py"
      - "apps/backend/chatballs/conversations/ingest.py"
      - "apps/backend/chatballs/conversations/domain_event_models.py"
      - "apps/backend/chatballs/conversations/migrations/0049_api_connector_event_transport.py"
      - "apps/backend/chatballs/conversations/message_views.py"
      - "apps/backend/chatballs/conversations/attachment_views.py"
      - "apps/backend/chatballs/integrations/views.py"
      - "apps/backend/chatballs/integrations/urls.py"
      - "apps/backend/chatballs_backend/urls_app.py"
      - ".github/workflows/api-connector-backend.yml"
  pull_request:
    paths:
      - "apps/backend/chatballs/api_connector/**"
      - "apps/backend/chatballs/conversations/inbound_dedup.py"
      - "apps/backend/chatballs/conversations/ingest.py"
      - "apps/backend/chatballs/api_connector/**"
      - "apps/backend/chatballs/integrations/views.py"
      - "apps/backend/chatballs/integrations/urls.py"
      - "apps/backend/chatballs_backend/urls_app.py"
      - ".github/workflows/api-connector-backend.yml"

permissions:
  contents: read

jobs:
  connector-ingress:
    name: Connector API + database regressions
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: chatballs
          POSTGRES_USER: chatballs_bootstrap
          POSTGRES_PASSWORD: chatballs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatballs_bootstrap -d chatballs"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      POSTGRES_DB: chatballs
      POSTGRES_USER: chatballs_bootstrap
      POSTGRES_PASSWORD: chatballs
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379/0
      CHATBALLS_SECRET_KEY: github-test-only-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: python -m pip install -r apps/backend/requirements.txt
      - run: python -m compileall -q apps/backend/chatballs/api_connector
      - name: API and shared ingest regression tests
        working-directory: apps/backend
        run: >-
          python -m pytest -q
          chatballs/api_connector/test_ingress.py
          chatballs/api_connector/test_media.py
          chatballs/api_connector/test_outbound.py
          chatballs/api_connector/test_outbound_media.py
          chatballs/api_connector/test_receipts.py
          chatballs/api_connector/test_echo.py
          chatballs/api_connector/test_observed.py
          chatballs/conversations/test_api_connector_routing.py
          chatballs/conversations/test_ingest_dedup.py
          chatballs/integrations/test_api_connector_profile.py
