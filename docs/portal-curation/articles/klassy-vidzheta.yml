articles:
  - slug: "klassy-vidzheta"
    categoryPath:
      - "Точки входа"
    locale: "ru"
    title: "Классы виджета"
    summary: "Какие части окна чата можно оформить своим CSS: классы, их назначение и пример стилей."
    content: |
      Свои CSS-стили меняют оформление внутри окна чата. Откройте настройки веб-подключения, раздел **Оформление**, и вставьте правила в поле **Свои CSS-стили**. Сохраните изменения: код виджета на сайте менять не требуется.

      Стили применяются внутри iframe чата и не влияют на страницу сайта. Цвет, иконку, положение, размер и форму кнопки открытия задавайте настройками раздела «Оформление»: перечисленные ниже классы относятся к окну чата, а не к этой кнопке.

      ## Классы окна чата

      В CSS перед именем класса ставьте точку: например, `.cb-header`.

      | Класс | Назначение |
      | --- | --- |
      | `cb-widget` | Корневой контейнер окна чата. |
      | `cb-header` | Шапка окна чата. |
      | `cb-header-icon` | Иконка в шапке: стандартный знак или загруженное изображение. Отсутствует, если иконка отключена. |
      | `cb-header-title` | Заголовок в шапке. |
      | `cb-header-button` | Кнопки разворачивания и сворачивания окна в шапке. |
      | `cb-body` | Прокручиваемая область чата. |
      | `cb-message` | Контейнер сообщения клиента, агента или специалиста. |
      | `cb-message--client` | Дополнительный класс контейнера сообщения клиента. |
      | `cb-message-content` | Обёртка содержимого сообщения, задающая его максимальную ширину. |
      | `cb-bubble` | Пузырь сообщения клиента, агента или специалиста. |
      | `cb-bubble--client` | Дополнительный класс пузыря сообщения клиента. |
      | `cb-bubble--agent` | Дополнительный класс пузыря ответа агента или специалиста. |
      | `cb-bubble--operator` | Дополнительный класс пузыря ответа специалиста; применяется вместе с `cb-bubble--agent`. |
      | `cb-bubble--audio` | Дополнительный класс пузыря голосового сообщения. |
      | `cb-message-time` | Время или состояние отправки под сообщением клиента. |
      | `cb-composer` | Область ввода сообщения, включая режим записи голосового. |
      | `cb-composer-input` | Текстовое поле ввода сообщения. |
      | `cb-composer-button` | Кнопки в области ввода: вложение, запись, отправка и отмена записи. |
      | `cb-send-button` | Дополнительный класс кнопки отправки текста, вложения или голосового сообщения. |
      | `cb-record-button` | Дополнительный класс кнопки начала записи голосового сообщения. |
      | `cb-start-footer` | Область с кнопкой начала чата. |
      | `cb-start-button` | Кнопка согласия и начала чата. |
      | `cb-form` | Форма передачи номера телефона по запросу в чате. |
      | `cb-form-field` | Поле номера телефона в этой форме. |
      | `cb-form-submit` | Кнопка отправки номера телефона. |
      | `cb-brand` | Нижняя область с подписью Chatballs. |

      Классы с `--` дополняют основной класс на том же элементе. Например, сообщение клиента имеет классы `cb-bubble` и `cb-bubble--client`. Общее правило для `.cb-bubble` затронет все пузыри; правило для `.cb-bubble--client` — только сообщения клиента.

      Чтобы изменить только ответы агента, исключите ответы специалиста: `.cb-bubble--agent:not(.cb-bubble--operator)`.

      ## Пример CSS

      Этот пример меняет шрифт шапки, скругление сообщений клиента и регистр текста кнопки начала чата:

      ```css
      .cb-header {
        font-family: "PT Sans", sans-serif;
      }

      .cb-bubble--client {
        border-radius: 18px 4px 18px 18px;
      }

      .cb-start-button {
        text-transform: uppercase;
      }
      ```

      Если PT Sans не установлен у посетителя, браузер использует шрифт без засечек. Шрифт, подключённый только на странице сайта, не становится доступным внутри iframe.

      Базовые стили этих классов имеют низкую специфичность, а свои CSS-стили добавляются после них. Для обычного изменения оформления достаточно селектора класса без `!important`. Вложенные элементы могут иметь собственные стили: например, правило для контейнера не меняет автоматически цвета всех его потомков.

      ## Ограничения и сброс

      Размер своих CSS-стилей — до 10 КБ. При сохранении удаляются `@import`, внешние адреса в `url(...)` и `expression`. Подключать таким способом внешние шрифты или изображения нельзя.

      Чтобы вернуться к базовому оформлению, нажмите **Сбросить** возле поля CSS и сохраните настройки.

      О подключении чата к сайту читайте в статье [Чат на сайте](/articles/veb-vidzhet).
